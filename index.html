<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>돈 거래 장부</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --primary: #1D4ED8;
    --primary-container: #EFF6FF;
    --on-primary: #FFFFFF;
    --ink: #0F172A;
    --secondary: #64748B;
    --neutral: #F8FAFC;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --success: #15803D;
    --success-container: #F0FDF4;
    --danger: #B91C1C;
    --danger-container: #FEF2F2;
    --amber: #B45309;
    --amber-container: #FFFBEB;
    --amber-border: #FCD34D;
    --k-borrow: #1D4ED8;
    --k-repay: #15803D;
    --k-lend: #7C3AED;
    --k-collect: #0F766E;
    --shadow: 0 4px 14px rgba(15, 23, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #60A5FA;
      --primary-container: #172554;
      --on-primary: #0B1220;
      --ink: #E5E7EB;
      --secondary: #94A3B8;
      --neutral: #0B1220;
      --surface: #111A2E;
      --border: #24304A;
      --success: #4ADE80;
      --success-container: #052E16;
      --danger: #F87171;
      --danger-container: #3B0F0F;
      --amber: #FBBF24;
      --amber-container: #2A1D05;
      --amber-border: #78530F;
      --k-borrow: #60A5FA;
      --k-repay: #4ADE80;
      --k-lend: #A78BFA;
      --k-collect: #2DD4BF;
      --shadow: 0 4px 14px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--neutral);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: -0.01em;
  }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 카드 / 버튼 / 입력 ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--on-primary); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > label, .lbl { font-size: 12px; font-weight: 700; color: var(--secondary); letter-spacing: .01em; }
  .input {
    width: 100%; border: 1px solid var(--border); background: var(--surface);
    border-radius: 8px; padding: 10px 12px; font-size: 15px;
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
  .muted { color: var(--secondary); }
  .small { font-size: 13px; }
  .err { color: var(--danger); font-size: 13px; min-height: 20px; }

  /* ---------- 잠금 / 설정 화면 ---------- */
  .gate { max-width: 400px; margin: 12vh auto 0; text-align: center; }
  .gate .badge {
    width: 56px; height: 56px; border-radius: 999px; margin: 0 auto 16px;
    background: var(--primary-container); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .gate h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.02em; }
  .gate form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--secondary); }
  .gate .alt { margin-top: 20px; font-size: 13px; color: var(--secondary); }
  .gate .alt a { color: var(--primary); cursor: pointer; text-decoration: underline; }
  .notice {
    background: var(--amber-container); border: 1px solid var(--amber-border); color: var(--amber);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; text-align: left;
  }

  /* ---------- 헤더 ---------- */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .top h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1.3; }
  .top .sub { font-size: 13px; color: var(--secondary); margin-top: 2px; }
  .top .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.on { background: var(--primary-container); border-color: var(--primary); color: var(--primary); }

  .dirty {
    position: sticky; top: 8px; z-index: 5; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: var(--amber-container); border: 1px solid var(--amber-border); color: var(--amber);
    border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
  }

  /* ---------- 요약 ---------- */
  .section-title { font-size: 13px; font-weight: 800; color: var(--secondary); letter-spacing: .01em; margin: 28px 0 10px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat .lbl { display: block; margin-bottom: 2px; }
  .stat .val { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; word-break: keep-all; }
  .stat .val small { font-size: 14px; font-weight: 600; margin-left: 1px; }
  .stat.hero { background: var(--primary-container); border-color: transparent; }
  .stat.hero .val { color: var(--primary); }
  .stat.hero.done .val { color: var(--success); }
  .bar { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--k-repay); }
  .track-bar { margin-top: 12px; }
  .track-bar .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--secondary); margin-bottom: 4px; }

  /* ---------- 사람별 ---------- */
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .person { text-align: left; cursor: pointer; width: 100%; transition: transform .12s, box-shadow .12s, border-color .12s; }
  .person:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
  .person.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .person .name { font-size: 16px; font-weight: 800; }
  .person .line { margin-top: 10px; }
  .person .line .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .person .line .tag { font-size: 12px; font-weight: 700; color: var(--secondary); }
  .person .line .amt { font-weight: 800; font-size: 17px; }
  .person .line .sub { font-size: 12px; color: var(--secondary); margin-top: 4px; }
  .done-txt { color: var(--success); }
  .over-txt { color: var(--amber); }

  /* ---------- 내역 ---------- */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .chip.sel { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .ledger { padding: 4px 16px; }
  .row {
    display: grid; grid-template-columns: 96px 76px minmax(0, 1fr) 118px 118px auto;
    gap: 8px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: 0; }
  .row.head { font-size: 12px; font-weight: 700; color: var(--secondary); padding: 10px 0; }
  .c-meta { display: contents; }
  .c-date { font-size: 13px; color: var(--secondary); }
  .c-who .n { font-weight: 700; }
  .c-who .memo { font-size: 13px; color: var(--secondary); word-break: break-word; }
  .c-amt, .c-bal { text-align: right; font-weight: 700; }
  .c-bal { color: var(--secondary); font-weight: 600; }
  .c-act { display: flex; gap: 4px; justify-content: flex-end; min-width: 0; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.borrow { color: var(--k-borrow); background: color-mix(in srgb, var(--k-borrow) 12%, transparent); }
  .pill.repay { color: var(--k-repay); background: color-mix(in srgb, var(--k-repay) 12%, transparent); }
  .pill.lend { color: var(--k-lend); background: color-mix(in srgb, var(--k-lend) 12%, transparent); }
  .pill.collect { color: var(--k-collect); background: color-mix(in srgb, var(--k-collect) 12%, transparent); }
  .amt-borrow { color: var(--k-borrow); } .amt-repay { color: var(--k-repay); }
  .amt-lend { color: var(--k-lend); } .amt-collect { color: var(--k-collect); }
  .empty { text-align: center; color: var(--secondary); padding: 32px 0; }

  /* ---------- 입력 폼 ---------- */
  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end; }
  .form-grid .wide { grid-column: span 2; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg label {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center;
    font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface);
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg input:checked + span { color: var(--on-primary); }
  .seg label:has(input:checked) { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
  .form-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .editing-tag { font-size: 13px; font-weight: 700; color: var(--amber); }
  details.pw { margin-top: 4px; }
  details.pw summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .manage { display: flex; gap: 8px; flex-wrap: wrap; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); text-align: center; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--secondary); }

  /* ---------- 모바일 ---------- */
  @media (max-width: 720px) {
    body { font-size: 14px; }
    .wrap { padding: 16px 12px 80px; }
    .top h1 { font-size: 20px; }
    .stats { grid-template-columns: 1fr; gap: 8px; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; }
    .stat .lbl { margin: 0; }
    .stat .val { font-size: 18px; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .wide { grid-column: span 2; }
    .row.head { display: none; }
    .row {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "who amt" "meta bal" "act act";
      gap: 4px 12px;
    }
    .c-meta { display: flex; align-items: center; gap: 8px; grid-area: meta; }
    .c-who { grid-area: who; } .c-amt { grid-area: amt; } .c-bal { grid-area: bal; font-size: 13px; }
    .c-bal::before { content: "잔액 "; font-weight: 400; }
    .c-act { grid-area: act; justify-content: flex-start; }
    .c-act:empty { display: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

/* =========================================================
 * 설정
 *  - 장부 파일: data/<이름>.enc.json  (기본 이름은 main)
 *  - 주소 뒤에 ?l=철수 를 붙이면 data/철수.enc.json 을 연다.
 *    → 사람마다 서로 다른 장부·비밀번호를 쓰고 싶을 때 사용
 * ========================================================= */
const LEDGER = (new URLSearchParams(location.search).get("l") || "main").replace(/[^0-9A-Za-z가-힣_-]/g, "") || "main";
const DATA_PATH = "data/" + LEDGER + ".enc.json";
const STORE_KEY = "ledger-pw:" + LEDGER;
const KDF_ITER = 600000;

const KINDS = {
  borrow:  { label: "빌림",     track: "owe",  sign: 1 },
  repay:   { label: "갚음",     track: "owe",  sign: -1 },
  lend:    { label: "빌려줌",   track: "recv", sign: 1 },
  collect: { label: "돌려받음", track: "recv", sign: -1 }
};
const TRACKS = {
  owe:  { title: (o) => o + " 님이 빌린 돈",   principal: "빌린 돈",   paid: "갚은 돈",     left: "남은 잔액" },
  recv: { title: (o) => o + " 님이 빌려준 돈", principal: "빌려준 돈", paid: "돌려받은 돈", left: "받을 잔액" }
};

/* =========================================================
 * 암호화 (PBKDF2-SHA256 → AES-256-GCM)
 * ========================================================= */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", te.encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encrypt(obj, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, KDF_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj))));
  return { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function decrypt(env, pw) {
  const key = await deriveKey(pw, unb64(env.salt), env.iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(env.iv) }, key, unb64(env.ct));
  const data = JSON.parse(td.decode(pt));
  if (!data || !Array.isArray(data.tx)) throw new Error("bad data");
  return data;
}

/* =========================================================
 * 상태
 * ========================================================= */
const state = {
  view: "loading",      // loading | login | setup | main
  env: null,            // 암호화된 장부 (data/*.enc.json 또는 불러온 파일)
  pw: null, data: null, dirty: false, edit: false,
  filter: "all", editingId: null,
  form: { date: today(), person: "", kind: "borrow", amount: "", memo: "" },
  error: ""
};

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = (n) => Number(n).toLocaleString("ko-KR");
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function fmtDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return y + "." + String(m).padStart(2, "0") + "." + String(d).padStart(2, "0") + " (" + WD[new Date(y, m - 1, d).getDay()] + ")";
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
function stored(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {}
  return null;
}

/* =========================================================
 * 집계
 * ========================================================= */
function compute(txs) {
  const sorted = txs.map((t, i) => ({ t, i })).sort((a, b) => a.t.date.localeCompare(b.t.date) || a.i - b.i);
  const zero = () => ({ principal: 0, paid: 0 });
  const totals = { owe: zero(), recv: zero() };
  const people = {}, running = {}, bal = {};
  for (const { t } of sorted) {
    const k = KINDS[t.kind];
    const p = (people[t.person] = people[t.person] || { name: t.person, owe: zero(), recv: zero() });
    const side = k.sign > 0 ? "principal" : "paid";
    p[k.track][side] += t.amount; totals[k.track][side] += t.amount;
    const key = t.person + "\u0000" + k.track;
    bal[key] = (bal[key] || 0) + k.sign * t.amount;
    running[t.id] = bal[key];
  }
  return { people, totals, running };
}
const hasTrack = (x) => x.principal > 0 || x.paid > 0;

/* =========================================================
 * 렌더링
 * ========================================================= */
function render() {
  const app = $("#app");
  if (state.view === "loading") app.innerHTML = '<div class="gate muted">불러오는 중…</div>';
  else if (state.view === "login") app.innerHTML = loginHtml();
  else if (state.view === "setup") app.innerHTML = setupHtml();
  else app.innerHTML = mainHtml();
  bind();
}

function loginHtml() {
  const hasStored = !!stored(STORE_KEY);
  return `
  <div class="gate">
    <div class="badge">🔒</div>
    <h1>돈 거래 장부</h1>
    <div class="muted small">공유받은 비밀번호를 입력하세요</div>
    <form id="loginForm" autocomplete="off">
      <div class="field"><label for="pw">비밀번호</label>
        <input class="input" id="pw" type="password" autocomplete="current-password" autofocus></div>
      <label class="check"><input type="checkbox" id="remember" ${hasStored ? "checked" : ""}> 이 기기에서 로그인 유지</label>
      <div class="err" id="err">${esc(state.error)}</div>
      <button class="btn primary" id="loginBtn" type="submit">열기</button>
    </form>
    <div class="alt">장부 파일을 직접 열려면 <a id="pickFile">파일 선택</a></div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>`;
}

function setupHtml() {
  return `
  <div class="gate">
    <div class="badge">📒</div>
    <h1>새 장부 만들기</h1>
    <div class="muted small">아직 <b>${esc(DATA_PATH)}</b> 파일이 없어요</div>
    <form id="setupForm" autocomplete="off">
      <div class="field"><label for="owner">장부 주인 이름</label>
        <input class="input" id="owner" placeholder="예: 강표" required></div>
      <div class="field"><label for="pw1">공유용 비밀번호 (8자 이상)</label>
        <input class="input" id="pw1" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="pw2">비밀번호 확인</label>
        <input class="input" id="pw2" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="notice">암호화된 파일은 공개 저장소에 올라갑니다. 누구나 파일을 내려받아 비밀번호를 무한정 대입해 볼 수 있으니,
        <b>길고 추측하기 어려운 비밀번호(12자 이상 권장)</b>를 쓰세요. 잊어버리면 복구할 수 없습니다.</div>
      <div class="err" id="err">${esc(state.error)}</div>
      <button class="btn primary" type="submit">장부 만들기</button>
    </form>
    <div class="alt">이미 만든 장부 파일이 있다면 <a id="pickFile">파일 선택</a></div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>`;
}

function trackSection(kind, c) {
  const x = c.totals[kind]; if (!hasTrack(x)) return "";
  const left = x.principal - x.paid, T = TRACKS[kind], o = state.data.owner;
  const pct = x.principal > 0 ? Math.min(100, Math.round((x.paid / x.principal) * 100)) : 0;
  const done = left === 0;
  const leftTxt = left < 0 ? "초과 " + won(-left) : won(left);
  return `
  <div class="section-title">${esc(T.title(o))}</div>
  <div class="stats">
    <div class="card stat"><span class="lbl">${T.principal}</span><span class="val num">${won(x.principal)}<small>원</small></span></div>
    <div class="card stat"><span class="lbl">${T.paid}</span><span class="val num">${won(x.paid)}<small>원</small></span></div>
    <div class="card stat hero ${done ? "done" : ""}"><span class="lbl">${done ? "정산 완료" : T.left}</span><span class="val num">${done ? "0" : leftTxt}<small>원</small></span></div>
  </div>
  <div class="track-bar"><div class="meta"><span>${T.paid} ${pct}%</span><span>${won(x.paid)} / ${won(x.principal)}원</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function personLine(kind, x) {
  if (!hasTrack(x)) return "";
  const T = TRACKS[kind], left = x.principal - x.paid;
  const pct = x.principal > 0 ? Math.min(100, Math.round((x.paid / x.principal) * 100)) : 0;
  const amt = left === 0 ? '<span class="amt done-txt">정산 완료</span>'
    : left < 0 ? `<span class="amt over-txt num">초과 ${won(-left)}원</span>`
    : `<span class="amt num">${won(left)}원</span>`;
  return `<div class="line">
    <div class="row1"><span class="tag">${esc(state.data.owner)} 님이 ${kind === "owe" ? "빌림" : "빌려줌"} · ${T.left}</span>${amt}</div>
    <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>
    <div class="sub num">${T.principal} ${won(x.principal)} · ${T.paid} ${won(x.paid)}</div></div>`;
}

function mainHtml() {
  const d = state.data, c = compute(d.tx);
  const names = Object.values(c.people).sort((a, b) => {
    const ba = (a.owe.principal - a.owe.paid) + (a.recv.principal - a.recv.paid);
    const bb = (b.owe.principal - b.owe.paid) + (b.recv.principal - b.recv.paid);
    return bb - ba || a.name.localeCompare(b.name, "ko");
  });
  if (state.filter !== "all" && !c.people[state.filter]) state.filter = "all";
  const rows = d.tx.map((t, i) => ({ t, i }))
    .filter(({ t }) => state.filter === "all" || t.person === state.filter)
    .sort((a, b) => b.t.date.localeCompare(a.t.date) || b.i - a.i);

  const noteOwner = `<span class="muted small">※ 모든 표기는 <b>${esc(d.owner)}</b> 님 기준이에요</span>`;

  return `
  <div class="top">
    <div>
      <h1>${esc(d.owner)} 님의 돈 거래 장부</h1>
      <div class="sub">${d.updated ? "마지막 업데이트 " + esc(d.updated) : "아직 저장 전"} · ${noteOwner}</div>
    </div>
    <div class="actions">
      <button class="btn ${state.edit ? "on" : ""}" id="toggleEdit">${state.edit ? "✎ 편집 중" : "✎ 편집"}</button>
      <button class="btn" id="lockBtn">잠금</button>
    </div>
  </div>

  ${state.dirty ? `<div class="dirty"><span>저장하지 않은 변경사항이 있어요</span>
    <button class="btn primary sm" id="saveBtn">저장 파일 내려받기</button></div>` : ""}

  ${state.edit ? formHtml(names) : ""}

  ${d.tx.length === 0 ? "" : trackSection("owe", c) + trackSection("recv", c)}

  ${names.length ? `
  <div class="section-title">사람별 현황</div>
  <div class="people">
    ${names.map((p) => `<button class="card person ${state.filter === p.name ? "sel" : ""}" data-person="${esc(p.name)}">
      <div class="name">${esc(p.name)}</div>${personLine("owe", p.owe)}${personLine("recv", p.recv)}</button>`).join("")}
  </div>` : ""}

  <div class="section-title">거래 내역 (${rows.length}건)</div>
  ${names.length > 1 ? `<div class="chips">
    <button class="chip ${state.filter === "all" ? "sel" : ""}" data-person="all">전체</button>
    ${names.map((p) => `<button class="chip ${state.filter === p.name ? "sel" : ""}" data-person="${esc(p.name)}">${esc(p.name)}</button>`).join("")}
  </div>` : ""}
  <div class="card ledger">
    ${rows.length ? `<div class="row head"><div>날짜</div><div>구분</div><div>이름 / 메모</div><div style="text-align:right">금액</div><div style="text-align:right">거래 후 잔액</div><div></div></div>` : ""}
    ${rows.length ? rows.map(({ t }) => rowHtml(t, c)).join("") :
      `<div class="empty">아직 기록이 없어요.${state.edit ? "" : " 편집 모드에서 첫 내역을 추가해 보세요."}</div>`}
  </div>

  ${state.edit ? manageHtml() : ""}
  <footer>암호화된 장부 · 비밀번호를 아는 사람만 볼 수 있어요</footer>`;
}

function rowHtml(t, c) {
  const k = KINDS[t.kind], bal = c.running[t.id];
  const sign = k.sign > 0 ? "+" : "−";
  return `<div class="row">
    <div class="c-meta"><div class="c-date">${fmtDate(t.date)}</div><div><span class="pill ${t.kind}">${k.label}</span></div></div>
    <div class="c-who"><div class="n">${esc(t.person)}</div>${t.memo ? `<div class="memo">${esc(t.memo)}</div>` : ""}</div>
    <div class="c-amt num amt-${t.kind}">${sign}${won(t.amount)}원</div>
    <div class="c-bal num">${bal === 0 ? "정산 완료" : bal < 0 ? "초과 " + won(-bal) + "원" : won(bal) + "원"}</div>
    <div class="c-act">${state.edit ? `<button class="btn sm" data-edit="${t.id}">수정</button><button class="btn sm danger" data-del="${t.id}">삭제</button>` : ""}</div>
  </div>`;
}

function formHtml(names) {
  const f = state.form, editing = state.editingId != null;
  return `
  <form class="card" id="txForm" autocomplete="off" style="margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <b>${editing ? "내역 수정" : "내역 추가"}</b>${editing ? '<span class="editing-tag">수정 중</span>' : ""}
    </div>
    <div class="form-grid">
      <div class="field"><label for="f-date">날짜</label><input class="input" id="f-date" type="date" value="${esc(f.date)}" required></div>
      <div class="field"><label for="f-person">이름</label>
        <input class="input" id="f-person" list="peopleList" value="${esc(f.person)}" placeholder="예: 철수" required>
        <datalist id="peopleList">${names.map((p) => `<option value="${esc(p.name)}">`).join("")}</datalist></div>
      <div class="field wide"><label>구분 <span style="font-weight:400">(빌림·갚음: ${esc(state.data.owner)} 님이 빌린 돈 / 빌려줌·돌려받음: 빌려준 돈)</span></label>
        <div class="seg">${Object.entries(KINDS).map(([key, k]) =>
          `<label><input type="radio" name="kind" value="${key}" ${f.kind === key ? "checked" : ""}><span>${k.label}</span></label>`).join("")}</div></div>
      <div class="field"><label for="f-amount">금액 (원)</label>
        <input class="input num" id="f-amount" inputmode="numeric" value="${esc(f.amount)}" placeholder="1,000,000" required></div>
      <div class="field wide"><label for="f-memo">메모 (선택)</label>
        <input class="input" id="f-memo" value="${esc(f.memo)}" placeholder="예: 전세 보증금 일부"></div>
    </div>
    <div class="form-actions">
      <button class="btn primary" type="submit">${editing ? "수정 완료" : "추가"}</button>
      ${editing ? '<button class="btn" type="button" id="cancelEdit">취소</button>' : ""}
    </div>
    <div class="err" id="err">${esc(state.error)}</div>
  </form>`;
}

function manageHtml() {
  return `
  <div class="section-title">장부 관리</div>
  <div class="card">
    <div class="manage">
      <button class="btn primary" id="saveBtn2">저장 파일 내려받기</button>
      <button class="btn" id="csvBtn">CSV로 내보내기</button>
      <button class="btn" id="ownerBtn">주인 이름 변경</button>
    </div>
    <details class="pw" style="margin-top:14px">
      <summary>비밀번호 변경</summary>
      <form id="pwForm" autocomplete="off" style="display:grid;gap:8px;margin-top:10px;max-width:320px">
        <input class="input" id="npw1" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" minlength="8" required>
        <input class="input" id="npw2" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" minlength="8" required>
        <button class="btn" type="submit">변경</button>
      </form>
    </details>
    <div class="notice" style="margin-top:14px">
      <b>저장 방법</b> — ① “저장 파일 내려받기”로 <b>${esc(LEDGER)}.enc.json</b>을 받고 ② 저장소의 <b>data</b> 폴더에 덮어쓴 뒤 ③ GitHub에 올리면(push) 1~2분 안에 지인들 화면에도 반영돼요.
    </div>
  </div>`;
}

/* =========================================================
 * 이벤트
 * ========================================================= */
function bind() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };

  on("#loginForm", "submit", onLogin);
  on("#setupForm", "submit", onSetup);
  on("#pickFile", "click", () => $("#fileIn").click());
  on("#fileIn", "change", onPickFile);

  on("#toggleEdit", "click", () => { state.edit = !state.edit; state.editingId = null; state.error = ""; render(); });
  on("#lockBtn", "click", lock);
  on("#saveBtn", "click", save);
  on("#saveBtn2", "click", save);
  on("#csvBtn", "click", exportCsv);
  on("#ownerBtn", "click", changeOwner);
  on("#pwForm", "submit", changePw);
  on("#txForm", "submit", onSubmitTx);
  on("#cancelEdit", "click", () => { state.editingId = null; state.form = { ...state.form, amount: "", memo: "" }; state.error = ""; render(); });

  document.querySelectorAll("[data-person]").forEach((b) => b.addEventListener("click", () => {
    const p = b.dataset.person;
    state.filter = (state.filter === p && b.classList.contains("person")) ? "all" : p; render();
  }));
  document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => startEdit(b.dataset.edit)));
  document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => delTx(b.dataset.del)));

  const amt = $("#f-amount");
  if (amt) amt.addEventListener("input", () => {
    const digitsBefore = amt.value.slice(0, amt.selectionStart).replace(/\D/g, "").length;
    const digits = amt.value.replace(/\D/g, "").slice(0, 13);
    amt.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
    let pos = 0, seen = 0;
    while (pos < amt.value.length && seen < digitsBefore) if (/\d/.test(amt.value[pos++])) seen++;
    amt.setSelectionRange(pos, pos);
  });
  const pw = $("#pw"); if (pw) pw.focus();
}

async function onLogin(e) {
  e.preventDefault();
  const pw = $("#pw").value; if (!pw) return;
  const remember = $("#remember").checked;
  const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "확인 중…";
  if (await tryUnlock(pw)) { stored(STORE_KEY, remember ? pw : null); return; }
  state.error = "비밀번호가 맞지 않거나 파일이 손상되었어요."; render();
}
async function tryUnlock(pw) {
  try {
    state.data = await decrypt(state.env, pw);
    state.pw = pw; state.view = "main"; state.error = ""; render(); return true;
  } catch (e) { return false; }
}
async function onSetup(e) {
  e.preventDefault();
  const owner = $("#owner").value.trim(), p1 = $("#pw1").value, p2 = $("#pw2").value;
  if (p1 !== p2) { $("#err").textContent = "비밀번호가 서로 달라요."; return; }
  if (p1.length < 8) { $("#err").textContent = "비밀번호는 8자 이상이어야 해요."; return; }
  state.data = { owner, created: today(), updated: "", tx: [] };
  state.pw = p1; state.dirty = true; state.edit = true; state.error = ""; state.view = "main"; render();
}
function onPickFile(e) {
  const f = e.target.files[0]; if (!f) return;
  f.text().then((txt) => {
    const env = JSON.parse(txt);
    if (!env.ct || !env.salt || !env.iv) throw new Error();
    state.env = env; state.view = "login"; state.error = ""; render();
  }).catch(() => { state.error = "올바른 장부 파일이 아니에요."; render(); });
}
function lock() {
  if (state.dirty && !confirm("저장하지 않은 변경사항이 사라져요. 잠글까요?")) return;
  stored(STORE_KEY, null);
  state.data = null; state.pw = null; state.dirty = false; state.edit = false; state.editingId = null; state.filter = "all";
  state.view = state.env ? "login" : "setup"; render();
}

/* ---------- 내역 편집 ---------- */
function onSubmitTx(e) {
  e.preventDefault();
  const date = $("#f-date").value, person = $("#f-person").value.trim();
  const kind = document.querySelector('input[name="kind"]:checked').value;
  const amountStr = $("#f-amount").value, memo = $("#f-memo").value.trim();
  const amount = parseInt(amountStr.replace(/\D/g, ""), 10);
  if (!date || !person || !amount) { $("#err").textContent = "날짜·이름·금액을 입력하세요."; return; }
  if (state.editingId != null) {
    const t = state.data.tx.find((x) => x.id === state.editingId);
    Object.assign(t, { date, person, kind, amount, memo });
    state.editingId = null; toast("수정했어요");
  } else {
    state.data.tx.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, person, kind, amount, memo });
    toast("추가했어요");
  }
  state.form = { date, person, kind, amount: "", memo: "" };
  state.dirty = true; state.error = ""; render();
  const a = $("#f-amount"); if (a) a.focus();
}
function startEdit(id) {
  const t = state.data.tx.find((x) => x.id === id); if (!t) return;
  state.editingId = id;
  state.form = { date: t.date, person: t.person, kind: t.kind, amount: won(t.amount), memo: t.memo || "" };
  render(); $("#txForm").scrollIntoView({ behavior: "smooth", block: "center" });
}
function delTx(id) {
  const t = state.data.tx.find((x) => x.id === id); if (!t) return;
  if (!confirm(`${fmtDate(t.date)} ${t.person} ${KINDS[t.kind].label} ${won(t.amount)}원을 삭제할까요?`)) return;
  state.data.tx = state.data.tx.filter((x) => x.id !== id);
  if (state.editingId === id) state.editingId = null;
  state.dirty = true; render(); toast("삭제했어요");
}
function changeOwner() {
  const n = prompt("장부 주인 이름", state.data.owner);
  if (n && n.trim()) { state.data.owner = n.trim(); state.dirty = true; render(); }
}
function changePw(e) {
  e.preventDefault();
  const a = $("#npw1").value, b = $("#npw2").value;
  if (a !== b) return toast("새 비밀번호가 서로 달라요");
  if (a.length < 8) return toast("8자 이상이어야 해요");
  state.pw = a; state.dirty = true;
  if (stored(STORE_KEY)) stored(STORE_KEY, a);
  render(); toast("변경했어요. 저장 파일을 다시 내려받아 올려야 적용돼요");
}

/* ---------- 저장 / 내보내기 ---------- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function save() {
  state.data.updated = today();
  const env = await encrypt(state.data, state.pw);
  state.env = env;
  download(LEDGER + ".enc.json", JSON.stringify(env), "application/json");
  state.dirty = false; render();
  toast("내려받은 파일을 data 폴더에 덮어쓰고 GitHub에 올려주세요");
}
function exportCsv() {
  const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  const c = compute(state.data.tx);
  const lines = ["날짜,이름,구분,금액,거래 후 잔액,메모"];
  [...state.data.tx].sort((a, b) => a.date.localeCompare(b.date)).forEach((t) =>
    lines.push([t.date, q(t.person), KINDS[t.kind].label, t.amount, c.running[t.id], q(t.memo || "")].join(",")));
  download(LEDGER + ".csv", "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}
window.addEventListener("beforeunload", (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });

/* =========================================================
 * 시작
 * ========================================================= */
(async function init() {
  if (!window.crypto || !crypto.subtle) {
    $("#app").innerHTML = '<div class="gate"><h1>지원하지 않는 환경</h1><p class="muted">https 주소(GitHub Pages)나 최신 브라우저에서 열어주세요.</p></div>';
    return;
  }
  render();
  try {
    const res = await fetch(DATA_PATH + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    state.env = await res.json();
  } catch (e) { state.env = null; }
  if (!state.env) { state.view = "setup"; render(); return; }
  const saved = stored(STORE_KEY);
  if (saved && (await tryUnlock(saved))) return;
  if (saved) stored(STORE_KEY, null);
  state.view = "login"; render();
})();
</script>
</body>
</html>
