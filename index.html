<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>돈 거래 장부</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --primary: #1D4ED8;
    --primary-container: #EFF6FF;
    --on-primary: #FFFFFF;
    --ink: #0F172A;
    --secondary: #64748B;
    --neutral: #F8FAFC;
    --head: #F1F5F9;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --success: #15803D;
    --danger: #B91C1C;
    --amber: #B45309;
    --amber-container: #FFFBEB;
    --amber-border: #FCD34D;
    --k-borrow: #1D4ED8;
    --k-repay: #15803D;
    --k-lend: #7C3AED;
    --k-collect: #0F766E;
    --shadow: 0 4px 14px rgba(15, 23, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #60A5FA;
      --primary-container: #172554;
      --on-primary: #0B1220;
      --ink: #E5E7EB;
      --secondary: #94A3B8;
      --neutral: #0B1220;
      --head: #16213A;
      --surface: #111A2E;
      --border: #24304A;
      --success: #4ADE80;
      --danger: #F87171;
      --amber: #FBBF24;
      --amber-container: #2A1D05;
      --amber-border: #78530F;
      --k-borrow: #60A5FA;
      --k-repay: #4ADE80;
      --k-lend: #A78BFA;
      --k-collect: #2DD4BF;
      --shadow: 0 4px 14px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--neutral); color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.6; letter-spacing: -0.01em;
  }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 80px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--secondary); }
  .small { font-size: 13px; }

  /* ---------- 공통 ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .card.flush { padding: 0; overflow: hidden; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--on-primary); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .btn.on { background: var(--primary-container); border-color: var(--primary); color: var(--primary); }
  .btn:disabled { opacity: .5; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > label { font-size: 12px; font-weight: 700; color: var(--secondary); }
  .input {
    width: 100%; border: 1px solid var(--border); background: var(--surface);
    border-radius: 8px; padding: 0 12px; height: 42px; font-size: 15px;
  }
  .input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
  .err { color: var(--danger); font-size: 13px; min-height: 20px; }
  .notice {
    background: var(--amber-container); border: 1px solid var(--amber-border); color: var(--amber);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; text-align: left;
  }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 800; margin: 28px 0 10px; }
  .section-title .hint { font-size: 12px; font-weight: 500; color: var(--secondary); }

  /* ---------- 잠금 / 설정 ---------- */
  .gate { max-width: 400px; margin: 12vh auto 0; text-align: center; }
  .gate .badge {
    width: 56px; height: 56px; border-radius: 999px; margin: 0 auto 16px;
    background: var(--primary-container); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .gate h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.02em; }
  .gate form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--secondary); }
  .gate .alt { margin-top: 20px; font-size: 13px; color: var(--secondary); }
  .gate .alt a { color: var(--primary); cursor: pointer; text-decoration: underline; }

  /* ---------- 헤더 ---------- */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .top h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1.3; }
  .top .sub { font-size: 13px; color: var(--secondary); margin-top: 2px; }
  .top .actions { display: flex; gap: 8px; }
  .dirty {
    position: sticky; top: 8px; z-index: 5; margin: 16px 0 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: var(--amber-container); border: 1px solid var(--amber-border); color: var(--amber);
    border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
  }

  /* ---------- 표 ---------- */
  .t { width: 100%; border-collapse: collapse; font-size: 14px; }
  .t th {
    background: var(--head); color: var(--secondary); font-size: 12px; font-weight: 700;
    text-align: left; padding: 10px 14px; white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  .t td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .t tbody tr:last-child td { border-bottom: 0; }
  .t tfoot td { background: var(--head); border-top: 1px solid var(--border); border-bottom: 0; font-weight: 700; }
  .t .r { text-align: right; }
  .t .nw { white-space: nowrap; }
  .t .strong { font-weight: 800; }
  .t .sub { font-size: 12px; color: var(--secondary); font-weight: 400; }
  .t .memo { color: var(--secondary); font-size: 13px; word-break: break-word; }
  .t .act { text-align: right; white-space: nowrap; }
  .t tr.click { cursor: pointer; }
  .t tr.click:hover td, .t tr.sel td { background: var(--primary-container); }
  .sortbtn { all: unset; cursor: pointer; }
  .sortbtn:hover { color: var(--primary); }
  .ok { color: var(--success); font-weight: 800; }
  .over { color: var(--amber); font-weight: 800; }
  .bal-main { color: var(--primary); font-size: 16px; font-weight: 800; }
  .pg { display: flex; align-items: center; gap: 8px; min-width: 110px; }
  .pg .bar { flex: 1; }
  .pg span { font-size: 12px; font-weight: 700; color: var(--secondary); min-width: 34px; text-align: right; }
  .bar { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--k-repay); }

  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.borrow { color: var(--k-borrow); background: color-mix(in srgb, var(--k-borrow) 12%, transparent); }
  .pill.repay { color: var(--k-repay); background: color-mix(in srgb, var(--k-repay) 12%, transparent); }
  .pill.lend { color: var(--k-lend); background: color-mix(in srgb, var(--k-lend) 12%, transparent); }
  .pill.collect { color: var(--k-collect); background: color-mix(in srgb, var(--k-collect) 12%, transparent); }
  .amt-borrow { color: var(--k-borrow); } .amt-repay { color: var(--k-repay); }
  .amt-lend { color: var(--k-lend); } .amt-collect { color: var(--k-collect); }
  .sumline { display: inline-flex; flex-wrap: wrap; gap: 4px 16px; justify-content: flex-end; }
  .empty { text-align: center; color: var(--secondary); padding: 36px 0; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip.sel { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .select { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; }

  /* ---------- 입력 폼 ---------- */
  .form-row { display: grid; grid-template-columns: 148px minmax(0, 1fr) 132px 150px minmax(0, 1.3fr) auto; gap: 10px; align-items: end; }
  .form-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .editing-tag { font-size: 13px; font-weight: 700; color: var(--amber); }
  .manage { display: flex; gap: 8px; flex-wrap: wrap; }
  details.pw summary { cursor: pointer; font-weight: 600; font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); text-align: center; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--secondary); }

  /* ---------- 모바일: 표 → 카드 목록 ---------- */
  @media (max-width: 760px) {
    body { font-size: 14px; }
    .wrap { padding: 16px 12px 80px; }
    .top h1 { font-size: 20px; }
    .form-row { grid-template-columns: 1fr 1fr; }
    .form-row .span2 { grid-column: span 2; }

    .t thead { display: none; }
    .t, .t tbody, .t tfoot, .t tr { display: block; width: 100%; }
    .t tr { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .t tbody tr:last-child { border-bottom: 0; }
    .t td, .t tfoot td {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 3px 0; border: 0; background: none; text-align: right;
    }
    .t td::before { content: attr(data-label); flex: none; font-size: 12px; font-weight: 700; color: var(--secondary); text-align: left; }
    .t td[data-label=""]::before, .t td:empty { display: none; }
    .t td.first { font-size: 16px; font-weight: 800; padding-bottom: 6px; }
    .t td.first::before { display: none; }
    .t td.act { justify-content: flex-start; padding-top: 6px; }
    .t tr.click:hover td, .t tr.sel td { background: none; }
    .t tr.sel { background: var(--primary-container); }
    .t tfoot tr { background: var(--head); }
    .pg { min-width: 130px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

/* =========================================================
 * 설정
 *  - 장부 파일: data/<이름>.enc.json  (기본 이름은 main)
 *  - 주소 뒤에 ?l=철수 를 붙이면 data/철수.enc.json 을 연다.
 *    → 사람마다 서로 다른 장부·비밀번호를 쓰고 싶을 때 사용
 * ========================================================= */
const LEDGER = (new URLSearchParams(location.search).get("l") || "main").replace(/[^0-9A-Za-z가-힣_-]/g, "") || "main";
const DATA_PATH = "data/" + LEDGER + ".enc.json";
const STORE_KEY = "ledger-pw:" + LEDGER;
const KDF_ITER = 600000;

const KINDS = {
  borrow:  { label: "빌림",     track: "owe",  sign: 1 },
  repay:   { label: "갚음",     track: "owe",  sign: -1 },
  lend:    { label: "빌려줌",   track: "recv", sign: 1 },
  collect: { label: "돌려받음", track: "recv", sign: -1 }
};
const TRACKS = {
  owe:  { name: "빌린 돈",   sub: "빌림 − 갚음",       principal: "빌린 돈",   paid: "갚은 돈",     left: "남은 잔액" },
  recv: { name: "빌려준 돈", sub: "빌려줌 − 돌려받음", principal: "빌려준 돈", paid: "돌려받은 돈", left: "받을 잔액" }
};

/* =========================================================
 * 암호화 (PBKDF2-SHA256 → AES-256-GCM)
 * ========================================================= */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", te.encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encrypt(obj, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, KDF_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj))));
  return { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function decrypt(env, pw) {
  const key = await deriveKey(pw, unb64(env.salt), env.iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(env.iv) }, key, unb64(env.ct));
  const data = JSON.parse(td.decode(pt));
  if (!data || !Array.isArray(data.tx)) throw new Error("bad data");
  return data;
}

/* =========================================================
 * 상태
 * ========================================================= */
const state = {
  view: "loading",      // loading | login | setup | main
  env: null,            // 암호화된 장부 (data/*.enc.json 또는 불러온 파일)
  pw: null, data: null, dirty: false, edit: false,
  handle: null,         // 연결된 컴퓨터의 장부 파일 (File System Access API)
  source: "site",       // 현재 env의 출처: site(배포된 파일) | file(연결된 파일)
  sel: [],              // 선택한 사람들 (비어 있으면 전체)
  kindFilter: "all", sortDesc: true, editingId: null,
  form: { date: today(), person: "", kind: "borrow", amount: "", memo: "" },
  error: ""
};

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = (n) => Number(n).toLocaleString("ko-KR");
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function fmtDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return y + "." + String(m).padStart(2, "0") + "." + String(d).padStart(2, "0") + " (" + WD[new Date(y, m - 1, d).getDay()] + ")";
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
function stored(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {}
  return null;
}

/* =========================================================
 * 컴퓨터의 장부 파일 연결 (File System Access API · Edge/Chrome)
 *  - 파일을 한 번 연결하면 핸들을 IndexedDB에 기억해 두고,
 *    열기·저장을 그 파일로 직접 한다 (내려받기 → 옮기기 불필요)
 *  - 지인들 브라우저에는 연결이 없으므로 배포된 data/*.enc.json 을 그대로 쓴다
 * ========================================================= */
const FS_OK = !!window.showOpenFilePicker;
const idb = {
  open: () => new Promise((res, rej) => {
    const r = indexedDB.open("ledger-handles", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("h");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }),
  async get(k) {
    try { const db = await this.open(); return await new Promise((res) => {
      const q = db.transaction("h").objectStore("h").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }
    catch (e) { return null; }
  },
  async set(k, v) {
    try { const db = await this.open(); await new Promise((res) => {
      const tx = db.transaction("h", "readwrite");
      if (v) tx.objectStore("h").put(v, k); else tx.objectStore("h").delete(k);
      tx.oncomplete = res; tx.onerror = res; }); } catch (e) {}
  }
};
async function readEnv(h) {
  const env = JSON.parse(await (await h.getFile()).text());
  if (!env.ct || !env.salt || !env.iv) throw new Error("bad file");
  return env;
}
async function ensurePerm(h) {
  const opt = { mode: "readwrite" };
  if ((await h.queryPermission(opt)) === "granted") return true;
  return (await h.requestPermission(opt)) === "granted";
}
async function linkFile() {
  try {
    const [h] = await window.showOpenFilePicker({ multiple: false, types: [{ description: "장부 파일", accept: { "application/json": [".json"] } }] });
    if (!(await ensurePerm(h))) return toast("파일 접근을 허용해야 연결할 수 있어요");
    if (state.data) {
      if (!confirm(`‘${h.name}’에 저장하면 그 파일이 현재 장부 내용으로 덮어써져요. 연결할까요?`)) return;
      state.handle = h; await idb.set(LEDGER, h); render(); toast("파일을 연결했어요"); return;
    }
    state.env = await readEnv(h); state.source = "file"; state.handle = h; await idb.set(LEDGER, h);
    const saved = stored(STORE_KEY);
    if (saved && (await tryUnlock(saved))) return;
    state.view = "login"; state.error = ""; render();
  } catch (e) {
    if (e && e.name === "AbortError") return;
    state.error = "올바른 장부 파일이 아니에요."; render();
  }
}
async function openLinked() {
  try {
    if (!(await ensurePerm(state.handle))) return;
    state.env = await readEnv(state.handle); state.source = "file";
    const saved = stored(STORE_KEY);
    if (saved && (await tryUnlock(saved))) return;
    state.view = "login"; state.error = ""; render();
  } catch (e) { state.error = "연결된 파일을 읽을 수 없어요. 다시 연결해 주세요."; render(); }
}
async function unlinkFile() {
  state.handle = null; await idb.set(LEDGER, null); render(); toast("연결을 해제했어요");
}

/* =========================================================
 * 집계
 * ========================================================= */
function compute(txs) {
  const sorted = txs.map((t, i) => ({ t, i })).sort((a, b) => a.t.date.localeCompare(b.t.date) || a.i - b.i);
  const zero = () => ({ principal: 0, paid: 0, n: 0, last: "" });
  const totals = { owe: zero(), recv: zero() };
  const people = {}, running = {}, bal = {};
  for (const { t } of sorted) {
    const k = KINDS[t.kind];
    const p = (people[t.person] = people[t.person] || { name: t.person, owe: zero(), recv: zero() });
    const side = k.sign > 0 ? "principal" : "paid";
    for (const x of [p[k.track], totals[k.track]]) { x[side] += t.amount; x.n++; x.last = t.date; }
    const key = t.person + "\u0000" + k.track;
    bal[key] = (bal[key] || 0) + k.sign * t.amount;
    running[t.id] = bal[key];
  }
  return { people, totals, running };
}
const hasTrack = (x) => x.n > 0;
const pctOf = (x) => x.principal > 0 ? Math.min(100, Math.round((x.paid / x.principal) * 100)) : 0;

/* 잔액 표시: 0 → 정산 완료, 음수 → 초과 */
function balHtml(left, big) {
  if (left === 0) return '<span class="ok">정산 완료</span>';
  if (left < 0) return '<span class="over">초과 ' + won(-left) + "</span>";
  return big ? '<span class="bal-main">' + won(left) + "</span>" : won(left);
}
const progHtml = (x) => { const p = pctOf(x); return `<div class="pg"><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`; };

/* =========================================================
 * 렌더링
 * ========================================================= */
function render() {
  const app = $("#app");
  if (state.view === "loading") app.innerHTML = '<div class="gate muted">불러오는 중…</div>';
  else if (state.view === "login") app.innerHTML = loginHtml();
  else if (state.view === "setup") app.innerHTML = setupHtml();
  else app.innerHTML = mainHtml();
  bind();
}

/* ---------- 전체 요약 표 ---------- */
function summaryHtml(c) {
  const rows = ["owe", "recv"].filter((tk) => hasTrack(c.totals[tk])).map((tk) => {
    const x = c.totals[tk], T = TRACKS[tk], left = x.principal - x.paid;
    return `<tr>
      <td class="first" data-label=""><span class="strong">${T.name}</span> <span class="sub">${T.sub}</span></td>
      <td class="r num" data-label="총 금액(원)">${won(x.principal)}</td>
      <td class="r num" data-label="상환 금액(원)">${won(x.paid)}</td>
      <td class="r num" data-label="잔액(원)">${balHtml(left, true)}</td>
      <td data-label="상환율">${progHtml(x)}</td></tr>`;
  }).join("");
  if (!rows) return "";
  return `
  <div class="section-title"><span>전체 요약</span><span class="hint">${esc(state.data.owner)} 님 기준</span></div>
  <div class="card flush"><table class="t">
    <thead><tr><th>구분</th><th class="r">총 금액(원)</th><th class="r">상환 금액(원)</th><th class="r">잔액(원)</th><th style="width:24%">상환율</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- 사람별 현황 표 ---------- */
function peopleHtml(c) {
  const list = [];
  for (const p of Object.values(c.people)) for (const tk of ["owe", "recv"]) if (hasTrack(p[tk])) list.push({ p, tk, x: p[tk] });
  if (!list.length) return "";
  list.sort((a, b) => (b.x.principal - b.x.paid) - (a.x.principal - a.x.paid) || a.p.name.localeCompare(b.p.name, "ko"));
  const rows = list.map(({ p, tk, x }) => {
    const T = TRACKS[tk], left = x.principal - x.paid;
    return `<tr class="click ${state.sel.includes(p.name) ? "sel" : ""}" data-person="${esc(p.name)}" data-row="1">
      <td class="first" data-label="">${esc(p.name)}</td>
      <td data-label="구분"><span class="pill ${tk === "owe" ? "borrow" : "lend"}">${T.name}</span></td>
      <td class="r num" data-label="총 금액(원)">${won(x.principal)}</td>
      <td class="r num" data-label="상환 금액(원)">${won(x.paid)}</td>
      <td class="r num strong" data-label="잔액(원)">${balHtml(left)}</td>
      <td data-label="상환율">${progHtml(x)}</td>
      <td class="r num" data-label="거래 수">${x.n}건</td>

  <div class="section-title"><span>사람별 현황</span><span class="hint">${state.sel.length
      ? `<b>${state.sel.length}명 선택됨</b> · <a id="clearSel" style="color:var(--primary);cursor:pointer;text-decoration:underline">선택 해제</a>`
      : "행을 눌러 여러 명을 선택하면 아래 거래 내역이 선택한 사람 것만 보여요"}</span></div>
  <div class="card flush"><table class="t">
    <thead><tr><th>이름</th><th>구분</th><th class="r">총 금액(원)</th><th class="r">상환 금액(원)</th><th class="r">잔액(원)</th><th style="width:16%">상환율</th><th class="r">거래 수</th><th class="r">최근 거래</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- 거래 내역 표 ---------- */
function ledgerHtml(c, names) {
  const d = state.data;
  const rows = d.tx.map((t, i) => ({ t, i }))
    .filter(({ t }) => (!state.sel.length || state.sel.includes(t.person)) && (state.kindFilter === "all" || t.kind === state.kindFilter))
    .sort((a, b) => (state.sortDesc ? -1 : 1) * (a.t.date.localeCompare(b.t.date) || a.i - b.i));

  const sums = {};
  rows.forEach(({ t }) => { sums[t.kind] = (sums[t.kind] || 0) + t.amount; });
  const sumHtml = Object.keys(KINDS).filter((k) => sums[k]).map((k) =>
    `<span class="amt-${k}">${KINDS[k].label} ${KINDS[k].sign > 0 ? "+" : "−"}${won(sums[k])}</span>`).join("");

  const body = rows.map(({ t }) => {
    const k = KINDS[t.kind];
    return `<tr>
      <td class="nw" data-label="날짜">${fmtDate(t.date)}</td>
      <td class="strong" data-label="이름">${esc(t.person)}</td>
      <td data-label="구분"><span class="pill ${t.kind}">${k.label}</span></td>
      <td class="r num strong amt-${t.kind}" data-label="금액(원)">${k.sign > 0 ? "+" : "−"}${won(t.amount)}</td>
      <td class="r num" data-label="거래 후 잔액(원)">${balHtml(c.running[t.id])}</td>
      <td class="memo" data-label="메모">${esc(t.memo || "")}</td>
      ${state.edit ? `<td class="act" data-label=""><button class="btn sm" data-edit="${t.id}">수정</button> <button class="btn sm danger" data-del="${t.id}">삭제</button></td>` : ""}
    </tr>`;
  }).join("");

  return `
  <div class="section-title"><span>거래 내역 <span class="muted num">${rows.length}건</span></span>
    <span class="hint">잔액은 같은 사람·같은 구분(빌린 돈/빌려준 돈)끼리 날짜순으로 계산돼요</span></div>

    <div class="chips">${names.length > 1 ? `
      <button class="chip ${!state.sel.length ? "sel" : ""}" data-person="all">전체</button>
      ${names.map((n) => `<button class="chip ${state.sel.includes(n) ? "sel" : ""}" data-person="${esc(n)}" aria-pressed="${state.sel.includes(n)}">${esc(n)}</button>`).join("")}` : ""}

    <select class="select" id="kindFilter" aria-label="구분 필터">
      <option value="all">구분: 전체</option>
      ${Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${state.kindFilter === k ? "selected" : ""}>${v.label}</option>`).join("")}
    </select>
  </div>
  <div class="card flush">
    ${rows.length ? `<table class="t">
      <thead><tr>
        <th><button class="sortbtn" id="sortDate" title="눌러서 정렬 방향 바꾸기">날짜 ${state.sortDesc ? "▼" : "▲"}</button></th>
        <th>이름</th><th>구분</th><th class="r">금액(원)</th><th class="r">거래 후 잔액(원)</th><th>메모</th>${state.edit ? "<th></th>" : ""}

      <tfoot><tr><td colspan="3">표시된 ${rows.length}건 합계</td><td colspan="${state.edit ? 4 : 3}" class="r"><span class="sumline num">${sumHtml}</span></td></tr></tfoot>
    </table>` : `<div class="empty">${d.tx.length ? "조건에 맞는 내역이 없어요." : "아직 기록이 없어요." + (state.edit ? "" : " 편집 모드에서 첫 내역을 추가해 보세요.")}</div>`}
  </div>`;
}

/* =========================================================
 * 이벤트
 * ========================================================= */
function bind() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };

  on("#loginForm", "submit", onLogin);
  on("#setupForm", "submit", onSetup);
  on("#pickFile", "click", () => (FS_OK ? linkFile() : $("#fileIn").click()));
  on("#fileIn", "change", onPickFile);
  on("#openLinked", "click", openLinked);
  on("#linkBtn", "click", linkFile);
  on("#unlinkBtn", "click", unlinkFile);

  on("#toggleEdit", "click", () => { state.edit = !state.edit; state.editingId = null; state.error = ""; render(); });
  on("#lockBtn", "click", lock);
  on("#saveBtn", "click", save);
  on("#saveBtn2", "click", save);
  on("#csvBtn", "click", exportCsv);
  on("#ownerBtn", "click", changeOwner);
  on("#pwForm", "submit", changePw);
  on("#txForm", "submit", onSubmitTx);
  on("#cancelEdit", "click", () => { state.editingId = null; state.form = { ...state.form, amount: "", memo: "" }; state.error = ""; render(); });
  on("#sortDate", "click", () => { state.sortDesc = !state.sortDesc; render(); });
  on("#kindFilter", "change", (e) => { state.kindFilter = e.target.value; render(); });

  document.querySelectorAll("[data-person]").forEach((b) => b.addEventListener("click", () => {
    const p = b.dataset.person;
    if (p === "all") state.sel = [];
    else state.sel = state.sel.includes(p) ? state.sel.filter((n) => n !== p) : [...state.sel, p];
    render();
  }));
  on("#clearSel", "click", () => { state.sel = []; render(); });
  document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => startEdit(b.dataset.edit)));
  document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => delTx(b.dataset.del)));

  const amt = $("#f-amount");
  if (amt) amt.addEventListener("input", () => {
    const digitsBefore = amt.value.slice(0, amt.selectionStart).replace(/\D/g, "").length;
    const digits = amt.value.replace(/\D/g, "").slice(0, 13);
    amt.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
    let pos = 0, seen = 0;
    while (pos < amt.value.length && seen < digitsBefore) if (/\d/.test(amt.value[pos++])) seen++;
    amt.setSelectionRange(pos, pos);
  });
  const pw = $("#pw"); if (pw) pw.focus();
}

async function onLogin(e) {
  e.preventDefault();
  const pw = $("#pw").value; if (!pw) return;
  const remember = $("#remember").checked;
  const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "확인 중…";
  if (await tryUnlock(pw)) { stored(STORE_KEY, remember ? pw : null); return; }
  state.error = "비밀번호가 맞지 않거나 파일이 손상되었어요."; render();
}
async function tryUnlock(pw) {
  try {
    state.data = await decrypt(state.env, pw);
    state.pw = pw; state.view = "main"; state.error = ""; render(); return true;
  } catch (e) { return false; }
}
async function onSetup(e) {
  e.preventDefault();
  const owner = $("#owner").value.trim(), p1 = $("#pw1").value, p2 = $("#pw2").value;
  if (p1 !== p2) { $("#err").textContent = "비밀번호가 서로 달라요."; return; }
  if (p1.length < 8) { $("#err").textContent = "비밀번호는 8자 이상이어야 해요."; return; }
  state.data = { owner, created: today(), updated: "", tx: [] };
  state.pw = p1; state.dirty = true; state.edit = true; state.error = ""; state.view = "main"; render();
}
function onPickFile(e) {
  const f = e.target.files[0]; if (!f) return;
  f.text().then((txt) => {
    const env = JSON.parse(txt);
    if (!env.ct || !env.salt || !env.iv) throw new Error();
    state.env = env; state.view = "login"; state.error = ""; render();
  }).catch(() => { state.error = "올바른 장부 파일이 아니에요."; render(); });
}
function lock() {
  if (state.dirty && !confirm("저장하지 않은 변경사항이 사라져요. 잠글까요?")) return;
  stored(STORE_KEY, null);
  state.data = null; state.pw = null; state.dirty = false; state.edit = false; state.editingId = null;
  state.sel = []; state.kindFilter = "all";
  state.view = state.env ? "login" : "setup"; render();
}

/* ---------- 내역 편집 ---------- */
function onSubmitTx(e) {
  e.preventDefault();
  const date = $("#f-date").value, person = $("#f-person").value.trim();
  const kind = $("#f-kind").value;
  const amount = parseInt($("#f-amount").value.replace(/\D/g, ""), 10), memo = $("#f-memo").value.trim();
  if (!date || !person || !amount) { $("#err").textContent = "날짜·이름·금액을 입력하세요."; return; }
  if (state.editingId != null) {
    const t = state.data.tx.find((x) => x.id === state.editingId);
    Object.assign(t, { date, person, kind, amount, memo });
    state.editingId = null; toast("수정했어요");
  } else {
    state.data.tx.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, person, kind, amount, memo });
    toast("추가했어요");
  }
  state.form = { date, person, kind, amount: "", memo: "" };
  state.dirty = true; state.error = ""; render();
  const a = $("#f-amount"); if (a) a.focus();
}
function startEdit(id) {
  const t = state.data.tx.find((x) => x.id === id); if (!t) return;
  state.editingId = id;
  state.form = { date: t.date, person: t.person, kind: t.kind, amount: won(t.amount), memo: t.memo || "" };
  render(); $("#txForm").scrollIntoView({ behavior: "smooth", block: "center" });
}
function delTx(id) {
  const t = state.data.tx.find((x) => x.id === id); if (!t) return;
  if (!confirm(`${fmtDate(t.date)} ${t.person} ${KINDS[t.kind].label} ${won(t.amount)}원을 삭제할까요?`)) return;
  state.data.tx = state.data.tx.filter((x) => x.id !== id);
  if (state.editingId === id) state.editingId = null;
  state.dirty = true; render(); toast("삭제했어요");
}
function changeOwner() {
  const n = prompt("장부 주인 이름", state.data.owner);
  if (n && n.trim()) { state.data.owner = n.trim(); state.dirty = true; render(); }
}
function changePw(e) {
  e.preventDefault();
  const a = $("#npw1").value, b = $("#npw2").value;
  if (a !== b) return toast("새 비밀번호가 서로 달라요");
  if (a.length < 8) return toast("8자 이상이어야 해요");
  state.pw = a; state.dirty = true;
  if (stored(STORE_KEY)) stored(STORE_KEY, a);
  render(); toast("변경했어요. 저장 파일을 다시 내려받아 올려야 적용돼요");
}

/* ---------- 저장 / 내보내기 ---------- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function save() {
  state.data.updated = today();
  const env = await encrypt(state.data, state.pw);
  state.env = env;
  const text = JSON.stringify(env);
  if (state.handle) {
    try {
      if (!(await ensurePerm(state.handle))) throw new Error("permission");
      const w = await state.handle.createWritable();
      await w.write(text); await w.close();
      state.dirty = false; render();
      toast("연결된 파일(" + state.handle.name + ")에 저장했어요");
      return;
    } catch (e) { toast("연결된 파일에 저장하지 못해 내려받기로 대신해요"); }
  }
  download(LEDGER + ".enc.json", text, "application/json");
  state.dirty = false; render();
  toast("내려받은 파일을 data 폴더에 덮어쓰고 GitHub에 올려주세요");
}
function exportCsv() {
  const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  const c = compute(state.data.tx);
  const lines = ["날짜,이름,구분,금액,거래 후 잔액,메모"];
  [...state.data.tx].sort((a, b) => a.date.localeCompare(b.date)).forEach((t) =>
    lines.push([t.date, q(t.person), KINDS[t.kind].label, t.amount, c.running[t.id], q(t.memo || "")].join(",")));
  download(LEDGER + ".csv", "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}
window.addEventListener("beforeunload", (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });

/* =========================================================
 * 시작
 * ========================================================= */
(async function init() {
  if (!window.crypto || !crypto.subtle) {
    $("#app").innerHTML = '<div class="gate"><h1>지원하지 않는 환경</h1><p class="muted">https 주소(GitHub Pages)나 최신 브라우저에서 열어주세요.</p></div>';
    return;
  }
  render();
  if (FS_OK) state.handle = await idb.get(LEDGER);
  // 이미 접근 권한이 살아 있는 연결 파일이 있으면 그 파일을 우선 사용
  if (state.handle) {
    try {
      if ((await state.handle.queryPermission({ mode: "readwrite" })) === "granted") { state.env = await readEnv(state.handle); state.source = "file"; }
    } catch (e) { state.env = null; }
  }
  if (!state.env) try {
    const res = await fetch(DATA_PATH + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    state.env = await res.json(); state.source = "site";
  } catch (e) { state.env = null; }
  if (!state.env) { state.view = "setup"; render(); return; }
  const saved = stored(STORE_KEY);
  if (saved && (await tryUnlock(saved))) return;
  if (saved) stored(STORE_KEY, null);
  state.view = "login"; render();
})();
</script>
</body>
